 * -------------------------------------------------------------------------
 * BUILD SYSTEM: Fabric Loom 1.6 / Minecraft 1.20.1
 * -------------------------------------------------------------------------
 * Migrated from: ForgeGradle 2.3-SNAPSHOT / Minecraft 1.12.2
 *
 * Structure kept as a SINGLE compilation unit (all BC modules in one source
 * tree) to avoid touching any Java source files during Phase 1.  A true
 * per-module Gradle subproject split is planned for a later phase.
 *
 * sub_projects/expression is compiled as a separate subproject because it has
 * its own code generator that must run before the main compile step.
 * -------------------------------------------------------------------------
 */

plugins {
    // Fabric Loom replaces net.minecraftforge.gradle.forge
    alias(libs.plugins.fabric.loom)
    id 'maven-publish'
}

// ---------------------------------------------------------------------------
// Version
// ---------------------------------------------------------------------------
def baseVersion = "8.0.1-pre.2+mc1.20.1"
if (System.getenv("MOD_VERSION")) {
    version = System.getenv("MOD_VERSION")
} else if (!Boolean.getBoolean("release")) {
    // Append short git hash for non-release builds, matching old ForgeGradle behaviour.
    def gitProc = "git rev-parse --short=12 HEAD".execute([], rootDir)
    gitProc.waitFor()
    def hash = gitProc.exitValue() == 0 ? gitProc.text.trim() : ""
    version = hash ? "${baseVersion}-${hash}" : "${baseVersion}-SNAPSHOT"
} else {
    version = baseVersion
}
group            = "com.mod-buildcraft"
base.archivesName = "buildcraft"

// ---------------------------------------------------------------------------
// Java toolchain (Java 17 required by Fabric Loom 1.6 + Minecraft 1.20.1)
// ---------------------------------------------------------------------------
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

// ---------------------------------------------------------------------------
// Fabric Loom configuration
// ---------------------------------------------------------------------------
loom {
    // Do NOT call splitEnvironmentSourceSets() here.
    // The Forge codebase uses @SideOnly inline on shared classes rather than
    // separate client/common source sets.  Splitting would break compilation
    // without touching Java.  Re-evaluate in Phase 2 after @SideOnly → @Environment
    // rename pass is complete.

    runs {
        client {
            client()
            setConfigName "BuildCraft Client"
            ideConfigGenerated true
            runDir "run"
            // Preserve original JVM tuning from the Forge runClient task
            vmArgs(
                "-Dbuildcraft.dev=true",
                "-XX:+UseG1GC",
                "-Xmx2G", "-Xms2G",
                "-XX:+UnlockExperimentalVMOptions",
                "-XX:G1NewSizePercent=20",
                "-XX:G1ReservePercent=20",
                "-XX:MaxGCPauseMillis=50",
                "-XX:G1HeapRegionSize=32M"
            )
        }
        server {
            server()
            setConfigName "BuildCraft Server"
            ideConfigGenerated true
            runDir "run"
        }
    }
}

// ---------------------------------------------------------------------------
// Source sets
// ---------------------------------------------------------------------------
// The old ForgeGradle build had three source sets: api, main, test.
// The api sourceSet (BuildCraftAPI/api) is folded into main here because
// Fabric has no concept of a separately-shipped API artifact at this stage.
// Re-split in a later phase when the API surface has been reworked.
sourceSets {
    // ---------------------------------------------------------------------------
    // libLeaf — isolated sourceSet for incremental lib/misc migration verification.
    // Only contains the 11 already-migrated leaf files; grows as more files are ported.
    // Run: ./gradlew compileLibLeaf
    // ---------------------------------------------------------------------------
    libLeaf {
        java {
            // The 11 migrated leaf files
            srcDir "common/buildcraft/lib/misc"
            include "ArrayUtil.java",
                    "MathUtil.java",
                    "ObjectUtilBC.java",
                    "TimeUtil.java",
                    "WorkerThreadUtil.java",
                    "DrawingUtil.java",
                    "ItemStackKey.java",
                    "ProfilerUtil.java",
                    "RandUtil.java",
                    "StackMatchingPredicate.java",
                    "WorldUtil.java"
        }
        // Fabric-native initializers + forge_stubs (registry + event migration)
        java {
            srcDir "common"
            include "buildcraft/lib/BCLibInitializer.java",
                    "buildcraft/lib/BCLibClientInitializer.java",
                    "buildcraft/lib/compat/forge_stubs/MissingMappingsStub.java",
                    "buildcraft/lib/compat/forge_stubs/ObjectHolderStub.java",
                    "buildcraft/lib/compat/forge_stubs/LegacyNetStubs.java",
                    "buildcraft/lib/compat/forge_stubs/LegacyCapabilityStubs.java",
                    "buildcraft/lib/net/BCNetworkManager.java",
                    "buildcraft/lib/net/UpdateTilePayload.java",
                    "buildcraft/lib/mj/IMJConnector.java",
                    "buildcraft/lib/mj/IMJReceiver.java",
                    "buildcraft/lib/mj/IMJRedstoneReceiver.java",
                    "buildcraft/lib/mj/MJEnergyStorage.java",
                    "buildcraft/lib/compat/BCItemStorage.java",
                    "buildcraft/lib/compat/BCFluidStorage.java",
                    // Middle-layer migration (unblock TileBC_Neptune) — zero-Forge / Easy
                    "buildcraft/lib/misc/data/IdAllocator.java",
                    "buildcraft/lib/misc/collect/OrderedEnumMap.java",
                    "buildcraft/lib/misc/collect/TypedKeyMap.java",
                    "buildcraft/lib/misc/collect/TypedMap.java",
                    "buildcraft/lib/misc/collect/TypedMapDirect.java",
                    "buildcraft/lib/misc/collect/TypedMapHierarchy.java",
                    "buildcraft/lib/migrate/BCVersion.java"
        }
        // BuildCraftFabric.java is in src/main/java; libLeaf depends on it for LOGGER
        java {
            srcDir "src/main/java"
            include "buildcraft/BuildCraftFabric.java"
        }
        // Layer A — api.core (BCLog/BCDebugging/IPlayerOwned) needed by TileBC_Neptune
        java {
            srcDir "BuildCraftAPI/api"
            include "buildcraft/api/core/BCLog.java",
                    "buildcraft/api/core/BCDebugging.java",
                    "buildcraft/api/core/IPlayerOwned.java"
        }
        // Layers B/C/D — TileBC_Neptune blockers (lib.misc utils, lib.net primitives, render/debug stubs)
        java {
            srcDir "common"
            include "buildcraft/lib/misc/BlockUtil.java",
                    "buildcraft/lib/misc/ChunkUtil.java",
                    "buildcraft/lib/misc/FakePlayerProvider.java",
                    "buildcraft/lib/misc/InventoryUtil.java",
                    "buildcraft/lib/misc/MessageUtil.java",
                    "buildcraft/lib/misc/PermissionUtil.java",
                    "buildcraft/lib/misc/StringUtilBC.java",
                    "buildcraft/lib/net/IPayloadWriter.java",
                    "buildcraft/lib/net/IPayloadReceiver.java",
                    "buildcraft/lib/net/PacketBufferBC.java",
                    "buildcraft/lib/net/MessageUpdateTile.java",
                    "buildcraft/lib/net/MessageManager.java",
                    "buildcraft/lib/client/render/DetachedRenderer.java",
                    "buildcraft/lib/debug/IAdvDebugTarget.java",
                    // lib.cache — chunk/tile caches (NeighbourTileCache stubbed to no-op)
                    "buildcraft/lib/cache/IChunkCache.java",
                    "buildcraft/lib/cache/ITileCache.java",
                    "buildcraft/lib/cache/TileCacheRet.java",
                    "buildcraft/lib/cache/TileCacheType.java",
                    "buildcraft/lib/cache/NoopTileCache.java",
                    "buildcraft/lib/cache/NeighbourTileCache.java",
                    "buildcraft/lib/cache/CachedChunk.java",
                    // lib.delta — numeric delta networking
                    "buildcraft/lib/delta/DeltaManager.java",
                    "buildcraft/lib/delta/DeltaInt.java",
                    // lib.debug — advanced debug target holder
                    "buildcraft/lib/debug/BCAdvDebugging.java",
                    // Stubs (cap/fluid/item) — minimal surface for TileBC_Neptune
                    "buildcraft/lib/cap/CapabilityHelper.java",
                    "buildcraft/lib/fluid/TankManager.java",
                    "buildcraft/lib/tile/item/ItemHandlerManager.java",
                    "buildcraft/lib/tile/item/StackChangeCallback.java",
                    // The integration target
                    "buildcraft/lib/tile/TileBC_Neptune.java"
        }
        // Layer E — TileEngineBase_BC8 and its direct dependencies
        java {
            srcDir "BuildCraftAPI/api"
            include "buildcraft/api/mj/IMjConnector.java",
                    "buildcraft/api/mj/IMjReceiver.java",
                    "buildcraft/api/mj/IMjRedstoneReceiver.java",
                    "buildcraft/api/mj/MjAPI.java",
                    "buildcraft/api/mj/MjCapabilityHelper.java",
                    "buildcraft/api/mj/MjToRfAutoConvertor.java",
                    "buildcraft/api/enums/EnumPowerStage.java",
                    "buildcraft/api/tiles/IDebuggable.java"
        }
        java {
            srcDir "common"
            include "buildcraft/lib/misc/NBTUtilBC.java",
                    "buildcraft/lib/misc/LocaleUtil.java",
                    "buildcraft/lib/misc/data/ModelVariableData.java",
                    "buildcraft/lib/block/VanillaRotationHandlers.java",
                    "buildcraft/lib/engine/IEngineLikeForLedger.java",
                    "buildcraft/lib/engine/TileEngineBase_BC8.java"
        }
        // Layer F — buildcraft.core entry point + standalone leaf files
        java {
            srcDir "common"
            include "buildcraft/core/BCCoreInitializer.java",
                    "buildcraft/core/statements/IBlockDefaultTriggers.java"
        }
        // Layer G — lib.registry (greenable subset; RegistrationHelper + PluggableRegistry
        // deferred — blocked by unmigrated lib.block / lib.item / api.transport)
        java {
            srcDir "common"
            include "buildcraft/lib/registry/TagManager.java",
                    "buildcraft/lib/registry/CreativeTabManager.java",
                    "buildcraft/lib/registry/MigrationManager.java",
                    "buildcraft/lib/registry/RegistryConfig.java"
        }
        // Layer H — lib.misc.data.Box + its dependency chain (gates core marker/volume)
        java {
            srcDir "BuildCraftAPI/api"
            include "buildcraft/api/core/IZone.java",
                    "buildcraft/api/core/IBox.java",
                    "buildcraft/api/core/IAreaProvider.java"
        }
        java {
            srcDir "common"
            include "buildcraft/lib/misc/VecUtil.java",
                    "buildcraft/lib/misc/PositionUtil.java",
                    "buildcraft/lib/misc/data/FaceDistance.java",
                    "buildcraft/lib/misc/data/Box.java"
        }
    }
    main {
        java {
            srcDir "common"               // all eight BC modules
            srcDir "common_old_license"   // older MPL files
            srcDir "BuildCraftAPI/api"    // BC public API (was a separate sourceSet)
            // expression sources are compiled by :sub_projects:expression and
            // consumed via 'implementation project(...)' — do NOT list them here.
        }
        resources {
            srcDir "src/main/resources"   // fabric.mod.json + future Fabric assets
            srcDir "buildcraft_resources" // textures, models, blockstates, recipes
            // Localization: .lang files must be converted to .json before 1.20.1
            // will load them.  They are still included here so the build does not
            // break; convert in a dedicated pass.
            srcDir "BuildCraft-Localization"
            exclude "**/*.md"
            // Guide resources (keep for now; may be ported separately)
            srcDir "BuildCraftGuide/guide_resources"
            exclude "pack.png"
            exclude "pack.mcmeta"
        }
    }
    test {
        java {
            srcDir "src/test/java"
        }
    }
}

// Wire libLeaf classpath to main's compile classpath so it sees Minecraft + Fabric API.
// Done outside the sourceSets block to avoid forward-reference issues.
sourceSets.libLeaf.compileClasspath += sourceSets.main.compileClasspath

// ---------------------------------------------------------------------------
// Repositories
// ---------------------------------------------------------------------------
repositories {
    maven {
        name = "FabricMC"
        url  = "https://maven.fabricmc.net/"
    }
    maven {
        // Team Reborn Energy — Fabric energy API replacing Forge RF / IEnergyStorage
        name = "TeamReborn"
        url  = "https://maven.teamreborn.energy/"
    }
    mavenCentral()
}

// ---------------------------------------------------------------------------
// Dependencies
// ---------------------------------------------------------------------------
dependencies {
    // ---- Fabric toolchain (managed by Loom, not bundled in the output jar) ----
    minecraft libs.minecraft
    // Yarn mappings: the :v2 classifier selects the intermediary-mapped variant.
    mappings variantOf(libs.yarn.mappings) { classifier "v2" }
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api

    // ---- Energy API (Phase 3 — not yet referenced in Java source) ----
    // teamreborn:energy replaces net.minecraftforge.energy.{IEnergyStorage, CapabilityEnergy}.
    // It is declared here so the dependency chain is established; actual usage in
    // tile entities is part of the capability migration phase.
    modImplementation libs.team.reborn.energy

    // ---- Annotation support ----
    // @Nonnull / @Nullable are used throughout; jsr305 must be on the compile
    // classpath.  It is NOT included in the output jar (annotation-only).
    implementation libs.jsr305

    // ---- Expression library (generated + compiled as a subproject) ----
    // This replaces the old inline srcDir approach.  Loom will put it on the
    // compile and runtime classpath; the jar will be included via remapping.
    implementation project(':sub_projects:expression')

    // ---- Tests ----
    testImplementation libs.junit
}

// ---------------------------------------------------------------------------
// Expression source generation
// ---------------------------------------------------------------------------
// The expression subproject must generate its autogen sources before the root
// compileJava runs.  Declaring the project dependency handles compilation order,
// but we also need the generateSources task to have run first.
compileJava.dependsOn ':sub_projects:expression:generateSources'

// ---------------------------------------------------------------------------
// Resource processing
// ---------------------------------------------------------------------------
processResources {
    inputs.property "version", project.version

    // Expand ${version} placeholder in fabric.mod.json (mirrors old mcmod.info expand)
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    // mcmod.info is no longer processed — it will be removed by cleanup-forge.sh.
    // The old expand + copy logic for mcmod.info is intentionally dropped.
}

// ---------------------------------------------------------------------------
// Compiler options
// ---------------------------------------------------------------------------
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xmaxerrs" << "2000"
    // Suppress all lint warnings during the migration.  The Forge-era source
    // generates thousands of warnings against 1.20.1 APIs.  Re-enable per module
    // after each module's porting pass is complete.
    options.compilerArgs << "-Xlint:none"
    // Verbose diagnostics kept — useful when tracking down cascading errors
    options.compilerArgs << "-Xdiags:verbose"
}

// ---------------------------------------------------------------------------
// Main jar
// ---------------------------------------------------------------------------
jar {
    from("LICENSE")     { rename { "${it}_BuildCraft" } }
    from("LICENSE-NEW") { rename { "${it}_BuildCraft" } }
    manifest.attributes(
        "Implementation-Title":   "BuildCraft",
        "Implementation-Version": project.version
    )
}

// ---------------------------------------------------------------------------
// Per-module convenience JARs
// ---------------------------------------------------------------------------
// These replace the old reobfJar-based module jars.  They are thin archives
// that slice the compiled output by package prefix — useful for consumers that
// want only a subset of BuildCraft.
//
// A true Gradle subproject split (where each module has its own compilation
// unit and can express inter-module dependencies) is deferred to a later phase
// because it requires Java-level changes (access modifiers, package refactoring).
["lib", "core", "builders", "energy", "factory", "silicon", "transport", "robotics"].each { mod ->
    tasks.register("${mod}Jar", Jar) {
        group       = "build (modules)"
        description = "Thin JAR containing only buildcraft.${mod} classes and its assets."
        archiveAppendix = mod
        dependsOn compileJava
        from(sourceSets.main.output) {
            include "buildcraft/${mod}/**"
        }
        // Also bundle the per-namespace assets so each module jar is self-contained
        from(sourceSets.main.resources.sourceDirectories) {
            include "assets/buildcraft${mod}/**"
            include "data/buildcraft${mod}/**"
        }
    }
}

// ---------------------------------------------------------------------------
// Checkstyle (optional — run via: ./gradlew checkstyleMain -PrunCheckstyle)
// ---------------------------------------------------------------------------
if (project.hasProperty("runCheckstyle")) {
    apply plugin: "checkstyle"
    checkstyle {
        configFile  = file("guidelines/buildcraft.checkstyle")
        // Upgraded from 7.2: 10.x supports Java 17 syntax.
        // NOTE: guidelines/buildcraft.checkstyle may need rule updates for 10.x.
        toolVersion = "10.12.4"
    }
}

// ---------------------------------------------------------------------------
// compileLibLeaf — compile only the verified-migrated leaf files
// ---------------------------------------------------------------------------
tasks.register("compileLibLeaf") {
    group       = "verification"
    description = "Compile only the lib-leaf source set for incremental migration verification."
    dependsOn compileLibLeafJava
}

// ---------------------------------------------------------------------------
// Publishing
// ---------------------------------------------------------------------------
publishing {
    repositories {
        maven {
            url = System.getenv("MAVEN_DIR")
                ? file(System.getenv("MAVEN_DIR"))
                : layout.buildDirectory.dir("maven").get().asFile
        }
    }
    publications {
        mavenJava(MavenPublication) {
            groupId    = "com.mod-buildcraft"
            artifactId = "buildcraft"
            version    = project.version
            from components.java
        }
    }
}

// ---------------------------------------------------------------------------
// Utility tasks
// ---------------------------------------------------------------------------
tasks.register("printVersion") {
    group       = "help"
    description = "Prints the computed mod version. Add -Drelease=true to suppress the git hash suffix."
    doLast {
        println "Version = ${project.version}"
    }
}
