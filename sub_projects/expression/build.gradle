/*
 * sub_projects/expression/build.gradle
 *
 * Pure-Java expression compiler library — no Minecraft or Fabric dependencies.
 * Updated for Gradle 8.8 + Java 17 compatibility.
 *
 * Changes from original:
 *   - Removed deprecated `maven` plugin (use `maven-publish` only)
 *   - Removed `eclipse` and `idea` plugins (IDE support via root project)
 *   - `compile`        → `implementation`   (removed in Gradle 7)
 *   - `testCompile`    → `testImplementation` (removed in Gradle 7)
 *   - `main` property  → `mainClass` on JavaExec (deprecated in Gradle 7.1)
 *   - `classifier`     → `archiveClassifier` on Jar tasks (deprecated in Gradle 7)
 *   - `sourceCompatibility` / `targetCompatibility` → java.toolchain
 *   - jsr305 3.0.1 → 3.0.2
 *   - junit 4.12   → 4.13.2
 */

plugins {
    id 'java'
    id 'maven-publish'
}

group            = "com.mod-buildcraft"
base.archivesName = "buildcraft-libexpression"
// Version is set by the root project when this is evaluated as a subproject.
// Fall back to a local default when the subproject is built in isolation.
if (!project.version || project.version == "unspecified") {
    version = "8.0.1-pre.2+mc1.20.1"
}

java {
    toolchain {
        // Use whatever JDK is installed; enforce Java 17 bytecode via options.release below.
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(System.getProperty("java.specification.version", "17")))
    }
    withSourcesJar()
}

// Produce Java 17 bytecode regardless of the host JDK version.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    // Annotation-only; not shipped in the output jar
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    testImplementation "junit:junit:4.13.2"
}

sourceSets {
    main {
        java {
            srcDir "src/main/java"
            srcDir "src/autogen/java"   // populated by generateSources
        }
        resources {
            srcDir "src/main/resources"
        }
    }
    test {
        java {
            srcDir "src/test/java"
        }
    }
    // The generator sourceSet compiles the code-generation tool itself.
    // It is NOT part of the published library jar.
    generator {
        java      { srcDir "src/generator/java"     }
        resources { srcDir "src/generator/resources" }
    }
}

// Gradle 8 requires an explicit strategy when the same resource path appears
// in multiple source roots. Apply EXCLUDE to all copy/jar/resource tasks.
tasks.withType(AbstractCopyTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// ---------------------------------------------------------------------------
// Source generation
// ---------------------------------------------------------------------------
tasks.register("removeOldAutoGen") {
    group = "build setup"
    doLast {
        delete "src/autogen/java/buildcraft"
    }
}

tasks.register("generateSources", JavaExec) {
    group       = "build setup"
    description = "Runs AutoGenerator to produce autogen/java sources."
    dependsOn   "removeOldAutoGen", "compileGeneratorJava", "processGeneratorResources"
    classpath   = sourceSets.generator.runtimeClasspath
    mainClass   = "buildcraft.meta.generate.AutoGenerator"
    args        "-out", "src/autogen/java", "-run", "-quiet"
    inputs.dir  "src/generator/java"
    outputs.dir "src/autogen/java"
}

compileJava.dependsOn "generateSources"

// sourcesJar includes src/autogen/java, so it must wait for generateSources.
tasks.named("sourcesJar") {
    dependsOn "generateSources"
}

// ---------------------------------------------------------------------------
// Sources jar (replaces old srcJar task)
// ---------------------------------------------------------------------------
// withSourcesJar() in the java {} block already creates a sourcesJar task;
// the old explicit srcJar task is superseded.

// ---------------------------------------------------------------------------
// Publishing
// ---------------------------------------------------------------------------
publishing {
    repositories {
        maven {
            url = System.getenv("MAVEN_DIR")
                ? file(System.getenv("MAVEN_DIR"))
                : layout.buildDirectory.dir("maven").get().asFile
        }
    }
    publications {
        mavenJava(MavenPublication) {
            groupId    = "com.mod-buildcraft"
            artifactId = "buildcraft-libexpression"
            version    = project.version
            from components.java
        }
    }
}
